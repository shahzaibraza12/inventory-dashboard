<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Store Professional E-Commerce</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Style */
        aside {
            width: 260px;
            background-color: #1e1e2d;
            color: #fff;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        aside h2 {
            font-size: 20px;
            margin-bottom: 30px;
            color: #3699ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        aside ul {
            list-style: none;
        }

        aside ul li {
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #b5b5c3;
        }

        aside ul li:hover, aside ul li.active {
            background-color: #3699ff;
            color: #fff;
        }

        /* Main Content Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        header {
            background: #fff;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ebedf2;
        }

        header h1 {
            font-size: 22px;
            color: #181c32;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .cart-icon-btn {
            background: #f4f7f6;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            font-size: 18px;
            color: #3699ff;
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff4757;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 50%;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        .dashboard-container {
            padding: 30px;
        }

        /* Views Control */
        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 0px 20px 0px rgba(76, 87, 125, 0.02);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-info h3 {
            font-size: 14px;
            color: #b5b5c3;
            margin-bottom: 5px;
        }

        .card-info p {
            font-size: 24px;
            font-weight: 700;
            color: #181c32;
        }

        .card-icon {
            width: 50px;
            height: 50px;
            background: rgba(54, 153, 255, 0.1);
            color: #3699ff;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 20px;
        }

        /* Storefront Grid */
        .store-filters {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 15px;
        }

        .store-filters input, .store-filters select {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #ebedf2;
            outline: none;
            font-size: 14px;
            width: 250px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 0px 20px 0px rgba(76, 87, 125, 0.02);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .product-card h4 {
            font-size: 16px;
            color: #181c32;
        }

        .product-card .price {
            font-size: 18px;
            font-weight: 700;
            color: #3699ff;
        }

        .product-card .stock-status {
            font-size: 12px;
            color: #1bc5bd;
        }

        /* Table Section */
        .table-section {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 0px 20px 0px rgba(76, 87, 125, 0.02);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-primary {
            background: #3699ff;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: #187de4;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th, table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ebedf2;
        }

        table th {
            font-size: 13px;
            color: #b5b5c3;
            text-transform: uppercase;
        }

        table td {
            font-size: 14px;
            color: #3f4254;
        }

        table th:last-child, table td:last-child {
            width: 150px;
            text-align: center;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-success {
            background: rgba(27, 197, 189, 0.1);
            color: #1bc5bd;
        }

        .badge-warning {
            background: rgba(255, 168, 0, 0.1);
            color: #ffa800;
        }
    </style>
</head>
<body>

    <aside>
        <h2><i class="fa-solid fa-boxes-stacked"></i> E-Store</h2>
        <ul>
            <li class="active" data-target="shop-view"><i class="fa-solid fa-store"></i> Customer Shop</li>
            <li data-target="dashboard-view"><i class="fa-solid fa-chart-pie"></i> Admin Dashboard</li>
            <li data-target="products-view"><i class="fa-solid fa-box"></i> Inventory Management</li>
        </ul>
    </aside>

    <main>
        <header>
            <h1 id="page-title">Customer Store</h1>
            <div class="header-right">
                <button class="cart-icon-btn" onclick="openCart()">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-badge" id="cart-count">0</span>
                </button>
                <div class="user-profile">
                    <i class="fa-solid fa-circle-user" style="font-size: 24px; color: #3699ff;"></i>
                    <span>Group 57 Lead</span>
                </div>
            </div>
        </header>

        <div class="dashboard-container">
            
            <div id="shop-view" class="view-section active">
                <div class="store-filters">
                    <input type="text" id="search-box" placeholder="Search products..." onkeyup="filterProducts()">
                    <select id="category-filter" onchange="filterProducts()">
                        <option value="">All Categories</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Furniture">Furniture</option>
                        <option value="Mobiles">Mobiles</option>
                    </select>
                </div>
                <div class="products-grid" id="store-products-grid">
                    </div>
            </div>

            <div id="dashboard-view" class="view-section">
                <div class="cards-grid">
                    <div class="card">
                        <div class="card-info">
                            <h3>Total Products</h3>
                            <p id="total-products">0</p>
                        </div>
                        <div class="card-icon"><i class="fa-solid fa-box-open"></i></div>
                    </div>
                    <div class="card">
                        <div class="card-info">
                            <h3>Low Stock Items</h3>
                            <p id="low-stock">0</p>
                        </div>
                        <div class="card-icon" style="color: #ffa800; background: rgba(255, 168, 0, 0.1);"><i class="fa-solid fa-triangle-exclamation"></i></div>
                    </div>
                    <div class="card">
                        <div class="card-info">
                            <h3>Total Categories</h3>
                            <p id="total-categories">5</p>
                        </div>
                        <div class="card-icon" style="color: #1bc5bd; background: rgba(27, 197, 189, 0.1);"><i class="fa-solid fa-layer-group"></i></div>
                    </div>
                </div>
            </div>

            <div id="products-view" class="view-section">
                <div class="table-section">
                    <div class="table-header">
                        <h3>Inventory Items List</h3>
                        <button class="btn-primary" onclick="addProduct()"><i class="fa-solid fa-plus"></i> Add Product</button>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Product Name</th>
                                <th>SKU</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-table-body">
                            </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        let allProducts = [];
        let cart = [];

        async function loadInventory() {
            try {
                const response = await fetch('/api/inventory');
                const result = await response.json();
                
                if (result.success) {
                    allProducts = result.data;
                    renderStorefront(allProducts);
                    renderAdminTable(allProducts);
                    updateMetrics(allProducts);
                }
            } catch (error) {
                console.error('Error fetching inventory:', error);
            }
        }

        function renderStorefront(products) {
            const grid = document.getElementById('store-products-grid');
            grid.innerHTML = '';
            products.forEach(item => {
                grid.innerHTML += `
                    <div class="product-card">
                        <h4>${item.name}</h4>
                        <p class="price">$${item.price}</p>
                        <p style="font-size:12px; color:#b5b5c3;">Category: ${item.category}</p>
                        <p class="stock-status">${item.stock > 0 ? 'In Stock (' + item.stock + ')' : 'Out of Stock'}</p>
                        <button class="btn-primary" onclick="addToCart(${item.id})" ${item.stock <= 0 ? 'disabled style="background:#ccc; cursor:not-allowed;"' : ''}>Add to Cart</button>
                    </div>
                `;
            });
        }

        function renderAdminTable(products) {
            const tableBody = document.getElementById('inventory-table-body');
            tableBody.innerHTML = '';
            products.forEach((item) => {
                tableBody.innerHTML += `
                    <tr>
                        <td>${item.id}</td>
                        <td>${item.name}</td>
                        <td>${item.sku}</td>
                        <td>${item.category}</td>
                        <td>$${item.price}</td>
                        <td>${item.stock}</td>
                        <td><span class="badge ${item.stock > 10 ? 'badge-success' : 'badge-warning'}">${item.stock > 10 ? 'In Stock' : 'Low Stock'}</span></td>
                        <td>
                            <button onclick="editProduct(${item.id})" style="background: #ffa800; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; margin-right: 5px;">Edit</button>
                            <button onclick="deleteProduct(${item.id})" style="background: #ff4757; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer;">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        function updateMetrics(products) {
            document.getElementById('total-products').textContent = products.length;
            document.getElementById('low-stock').textContent = products.filter(i => i.stock <= 10).length;
        }

        function filterProducts() {
            const query = document.getElementById('search-box').value.toLowerCase();
            const category = document.getElementById('category-filter').value;

            const filtered = allProducts.filter(item => {
                const matchesName = item.name.toLowerCase().includes(query);
                const matchesCategory = category === "" || item.category === category;
                return matchesName && matchesCategory;
            });

            renderStorefront(filtered);
        }

        function addToCart(id) {
            const product = allProducts.find(p => p.id === id);
            if (product) {
                cart.push(product);
                document.getElementById('cart-count').textContent = cart.length;
                alert(`${product.name} added to cart!`);
            }
        }

        function openCart() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            let summary = cart.map(item => `- ${item.name}: $${item.price}`).join('\n');
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            alert(`--- Shopping Cart ---\n\n${summary}\n\nTotal: $${total.toFixed(2)}`);
        }

        async function addProduct() {
            const name = prompt("Enter product name:");
            if (!name) return;
            const sku = prompt("Enter product SKU code:");
            const category = prompt("Enter Category:");
            const price = prompt("Enter Price:");
            const stock = prompt("Enter Stock quantity:");

            if (!sku || !price || !stock) return alert("All fields are required!");

            await fetch('/api/inventory', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, sku, category: category || 'General', price: parseFloat(price), stock: parseInt(stock) })
            });
            loadInventory();
        }

        async function deleteProduct(id) {
            if (!confirm("Delete this product?")) return;
            await fetch(`/api/inventory/${id}`, { method: 'DELETE' });
            loadInventory();
        }

        async function editProduct(id) {
            const newName = prompt("New name:");
            const newPrice = prompt("New price:");
            const newStock = prompt("New stock:");
            if (!newName && !newPrice && !newStock) return;

            await fetch(`/api/inventory/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: newName || undefined, price: newPrice ? parseFloat(newPrice) : undefined, stock: newStock ? parseInt(newStock) : undefined })
            });
            loadInventory();
        }

        // Sidebar Navigation Switcher
        document.querySelectorAll('aside ul li').forEach(li => {
            li.addEventListener('click', function() {
                document.querySelectorAll('aside ul li').forEach(item => item.classList.remove('active'));
                this.classList.add('active');
                
                document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
                const target = this.getAttribute('data-target');
                document.getElementById(target).classList.add('active');

                const titles = {
                    'shop-view': 'Customer Store',
                    'dashboard-view': 'Admin Dashboard',
                    'products-view': 'Inventory Management'
                };
                document.getElementById('page-title').textContent = titles[target];
            });
        });

        document.addEventListener('DOMContentLoaded', loadInventory);
    </script>
</body>
</html>
