<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Inventory Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Style */
        aside {
            width: 260px;
            background-color: #1e1e2d;
            color: #fff;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        aside h2 {
            font-size: 20px;
            margin-bottom: 30px;
            color: #3699ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        aside ul {
            list-style: none;
        }

        aside ul li {
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #b5b5c3;
        }

        aside ul li:hover, aside ul li.active {
            background-color: #3699ff;
            color: #fff;
        }

        /* Main Content Area */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        header {
            background: #fff;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ebedf2;
        }

        header h1 {
            font-size: 22px;
            color: #181c32;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        .dashboard-container {
            padding: 30px;
        }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 0px 20px 0px rgba(76, 87, 125, 0.02);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-info h3 {
            font-size: 14px;
            color: #b5b5c3;
            margin-bottom: 5px;
        }

        .card-info p {
            font-size: 24px;
            font-weight: 700;
            color: #181c32;
        }

        .card-icon {
            width: 50px;
            height: 50px;
            background: rgba(54, 153, 255, 0.1);
            color: #3699ff;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 20px;
        }

        /* Table Section */
        .table-section {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 0px 20px 0px rgba(76, 87, 125, 0.02);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .table-header h3 {
            font-size: 18px;
            color: #181c32;
        }

        .btn-primary {
            background: #3699ff;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background: #187de4;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th, table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ebedf2;
        }

        table th {
            font-size: 13px;
            color: #b5b5c3;
            text-transform: uppercase;
        }

        table td {
            font-size: 14px;
            color: #3f4254;
        }

        table th:last-child, table td:last-child {
            width: 150px;
            text-align: center;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-success {
            background: rgba(27, 197, 189, 0.1);
            color: #1bc5bd;
        }

        .badge-warning {
            background: rgba(255, 168, 0, 0.1);
            color: #ffa800;
        }
    </style>
</head>
<body>

    <aside>
        <h2><i class="fa-solid fa-boxes-stacked"></i> E-Store</h2>
        <ul>
            <li class="active"><i class="fa-solid fa-chart-pie"></i> Dashboard</li>
            <li><i class="fa-solid fa-box"></i> Products</li>
            <li><i class="fa-solid fa-tags"></i> Categories</li>
            <li><i class="fa-solid fa-gear"></i> Settings</li>
        </ul>
    </aside>

    <main>
        <header>
            <h1>Inventory Dashboard</h1>
            <div class="user-profile">
                <i class="fa-solid fa-circle-user" style="font-size: 24px; color: #3699ff;"></i>
                <span>Group 57 Lead</span>
            </div>
        </header>

        <div class="dashboard-container">
            <div class="cards-grid">
                <div class="card">
                    <div class="card-info">
                        <h3>Total Products</h3>
                        <p>120</p>
                    </div>
                    <div class="card-icon"><i class="fa-solid fa-box-open"></i></div>
                </div>
                <div class="card">
                    <div class="card-info">
                        <h3>Low Stock Items</h3>
                        <p>8</p>
                    </div>
                    <div class="card-icon" style="color: #ffa800; background: rgba(255, 168, 0, 0.1);"><i class="fa-solid fa-triangle-exclamation"></i></div>
                </div>
                <div class="card">
                    <div class="card-info">
                        <h3>Total Categories</h3>
                        <p>5</p>
                    </div>
                    <div class="card-icon" style="color: #1bc5bd; background: rgba(27, 197, 189, 0.1);"><i class="fa-solid fa-layer-group"></i></div>
                </div>
            </div>

            <div class="table-section">
                <div class="table-header">
                    <h3>Inventory Items List</h3>
                    <button class="btn-primary"><i class="fa-solid fa-plus"></i> Add Product</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Product Name</th>
                            <th>SKU</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Dynamic rows will load here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Function to fetch inventory data from backend and populate table
        async function loadInventory() {
            try {
                const response = await fetch('http://localhost:5000/api/inventory');
                const result = await response.json();
                
                if (result.success) {
                    const items = result.data;
                    const tableBody = document.querySelector('tbody');
                    tableBody.innerHTML = ''; 

                    items.forEach((item) => {
                        const row = `
                            <tr>
                                <td>${item.id}</td>
                                <td>${item.name}</td>
                                <td>${item.sku}</td>
                                <td>${item.category}</td>
                                <td>$${item.price}</td>
                                <td>${item.stock}</td>
                                <td><span class="badge ${item.stock > 10 ? 'badge-success' : 'badge-warning'}">${item.stock > 10 ? 'In Stock' : 'Low Stock'}</span></td>
                                <td>
                                    <button onclick="editProduct(${item.id})" style="background: #ffa800; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; margin-right: 5px;">Edit</button>
                                    <button onclick="deleteProduct(${item.id})" style="background: #ff4757; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer;">Delete</button>
                                </td>
                            </tr>
                        `;
                        tableBody.innerHTML += row;
                    });
                }
            } catch (error) {
                console.error('Error connecting to the backend server:', error);
            }
        }

        // Function to add a new product
        async function addProduct() {
            const name = prompt("Enter product name:");
            if (!name) return;
            const sku = prompt("Enter product SKU code:");
            const category = prompt("Enter Category:");
            const price = prompt("Enter Price:");
            const stock = prompt("Enter Stock quantity:");

            if (!sku || !price || !stock) {
                alert("Please enter all required data fields!");
                return;
            }

            try {
                const response = await fetch('http://localhost:5000/api/inventory', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name,
                        sku,
                        category: category || 'General',
                        price: parseFloat(price),
                        stock: parseInt(stock)
                    })
                });

                const result = await response.json();
                if (result.success) {
                    alert("Product Added Successfully!");
                    loadInventory();
                } else {
                    alert("Error: " + result.message);
                }
            } catch (error) {
                console.error('Error in adding product:', error);
            }
        }

        // Function to delete a product
        async function deleteProduct(id) {
            if (!confirm("Are you sure you want to delete this product?")) return;

            try {
                const response = await fetch(`http://localhost:5000/api/inventory/${id}`, {
                    method: 'DELETE'
                });

                const result = await response.json();
                if (result.success) {
                    alert("Product deleted successfully!");
                    loadInventory();
                } else {
                    alert("Error: " + result.message);
                }
            } catch (error) {
                console.error('Error deleting product:', error);
            }
        }

        // Function to edit an existing product
        async function editProduct(id) {
            const newName = prompt("Enter new product name:");
            const newPrice = prompt("Enter new price:");
            const newStock = prompt("Enter new stock quantity:");

            if (!newName && !newPrice && !newStock) return;

            try {
                const response = await fetch(`http://localhost:5000/api/inventory/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: newName || undefined,
                        price: newPrice ? parseFloat(newPrice) : undefined,
                        stock: newStock ? parseInt(newStock) : undefined
                    })
                });

                const result = await response.json();
                if (result.success) {
                    alert("Product updated successfully!");
                    loadInventory();
                } else {
                    alert("Error: " + result.message);
                }
            } catch (error) {
                console.error('Error updating product:', error);
            }
        }

        // Initialize application on DOM load
        document.addEventListener('DOMContentLoaded', () => {
            loadInventory();
            const addBtn = document.querySelector('.btn-primary');
            addBtn.addEventListener('click', addProduct);
        });
    </script>
</body>
</html>
