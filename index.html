<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Store - Customer Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #1e1e2d; color: #333; padding: 20px; }
        
        .container { max-width: 1100px; margin: auto; }
        
        /* Navbar */
        .navbar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 25px; border-radius: 12px; box-shadow: 0px 4px 12px rgba(0,0,0,0.1); margin-bottom: 25px; }
        .navbar h2 { color: #181c32; font-size: 20px; }
        .nav-actions { display: flex; gap: 15px; align-items: center; }
        .cart-btn { background: #f3f6f9; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; color: #3699ff; position: relative; }
        .logout-btn { background: #f64e60; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; }

        /* Search Bar */
        .search-bar { margin-bottom: 25px; }
        .search-bar input { width: 100%; padding: 12px 20px; border: 1px solid #ebedf2; border-radius: 8px; outline: none; font-size: 15px; background: white; }

        /* Products Grid */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .product-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0px 4px 12px rgba(0,0,0,0.05); display: flex; flex-direction: column; padding: 15px; }
        .product-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; }
        .product-card h4 { font-size: 16px; color: #181c32; margin-bottom: 5px; }
        .product-card .price { color: #3699ff; font-weight: 700; font-size: 15px; margin-bottom: 10px; }
        
        .card-buttons { display: flex; gap: 8px; margin-top: auto; }
        .btn-cart { flex: 1; background: #f3f6f9; color: #3699ff; border: none; padding: 8px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
        .btn-buy { flex: 1; background: #1bc5bd; color: white; border: none; padding: 8px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
        .btn-cart:hover { background: #e1e9f0; }
        .btn-buy:hover { background: #118d87; }

        /* Sidebar Cart / Checkout Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
        .sidebar { position: fixed; top: 0; right: -400px; width: 400px; height: 100%; background: white; box-shadow: -5px 0 25px rgba(0,0,0,0.2); z-index: 1000; padding: 25px; overflow-y: auto; transition: 0.3s; }
        .sidebar.open { right: 0; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #3f4254; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ebedf2; border-radius: 6px; outline: none; font-size: 14px; }
        
        .checkout-summary { background: #f9f9f9; padding: 15px; border-radius: 8px; margin: 15px 0; font-size: 14px; }
        .checkout-summary div { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .total-row { font-weight: 700; font-size: 16px; border-top: 1px solid #ddd; padding-top: 8px; color: #181c32; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Top Navbar -->
        <div class="navbar">
            <h2>🛒 E-Store Customer Dashboard</h2>
            <div class="nav-actions">
                <button class="cart-btn" onclick="openCartSidebar()">
                    <i class="fa-solid fa-cart-shopping"></i> Cart (<span id="cart-count">0</span>)
                </button>
                <button class="logout-btn" onclick="handleLogout()">Logout</button>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" id="search-input" onkeyup="searchProducts()" placeholder="🔍 Search products...">
        </div>

        <!-- Products Grid -->
        <div id="products-grid" class="products-grid">
            <!-- Dynamic products will render here -->
        </div>
    </div>

    <!-- CART / CHECKOUT SIDEBAR -->
    <div class="modal-overlay" id="modal-overlay" onclick="closeCartSidebar()"></div>
    <div class="sidebar" id="cart-sidebar">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #ebedf2; padding-bottom: 10px;">
            <h3>🛍️ Checkout & Cart</h3>
            <i class="fa-solid fa-xmark" style="cursor: pointer; font-size: 18px;" onclick="closeCartSidebar()"></i>
        </div>

        <!-- Cart Items List -->
        <div id="sidebar-items" style="max-height: 30vh; overflow-y: auto; margin-bottom: 15px;">
            <p style="color: #b5b5c3; text-align: center; font-size: 14px;">Your cart is empty</p>
        </div>

        <!-- Customer Details Form -->
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="cust-name" placeholder="Enter your name">
        </div>
        <div class="form-group">
            <label>Delivery Address</label>
            <input type="text" id="cust-address" placeholder="Enter complete address">
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" id="cust-phone" placeholder="03XXXXXXXXX">
        </div>
        <div class="form-group">
            <label>Payment Method</label>
            <select id="payment-method" onchange="calculateTotal()">
                <option value="online">Online Bank Transfer (Rs. 0 Extra Charges)</option>
                <option value="cod">Cash on Delivery - COD (Rs. 60 Extra Charges)</option>
            </select>
        </div>

        <!-- Bill Calculation Summary -->
        <div class="checkout-summary">
            <div><span>Subtotal:</span> <span id="summary-subtotal">Rs. 0</span></div>
            <div><span>Delivery Charges:</span> <span id="summary-charges">Rs. 0</span></div>
            <div class="total-row"><span>Total Amount:</span> <span id="summary-total">Rs. 0</span></div>
        </div>

        <button onclick="placeOrder()" style="width: 100%; background: #1bc5bd; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 15px;">Confirm & Place Order</button>
    </div>

    <script>
        // Sample Products Database
        const storeProducts = [
            { id: 1, name: "Gaming Headset", price: 4500, image: "https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=300" },
            { id: 2, name: "Mechanical Keyboard", price: 6500, image: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=300" },
            { id: 3, name: "Wireless Mouse", price: 2500, image: "https://images.unsplash.com/photo-1615663245857-ac93bb7c39e7?w=300" },
            { id: 4, name: "HD Monitor 24-inch", price: 28000, image: "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=300" }
        ];

        let cart = [];

        // Render products on page load
        window.addEventListener('DOMContentLoaded', () => {
            renderProducts(storeProducts);
        });

        function renderProducts(products) {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';
            products.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${p.image}" alt="${p.name}">
                        <h4>${p.name}</h4>
                        <div class="price">Rs. ${p.price.toLocaleString()}</div>
                        <div class="card-buttons">
                            <button class="btn-cart" onclick="addToCart(${p.id})">Add to Cart</button>
                            <button class="btn-buy" onclick="directBuy(${p.id})">Buy Now</button>
                        </div>
                    </div>
                `;
            });
        }

        // Search Function
        function searchProducts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = storeProducts.filter(p => p.name.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        // Add to Cart
        function addToCart(productId) {
            const product = storeProducts.find(p => p.id === productId);
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
            alert(`${product.name} has been added to your cart!`);
        }

        // Direct Buy Now
        function directBuy(productId) {
            const product = storeProducts.find(p => p.id === productId);
            cart = [{ ...product, quantity: 1 }];
            updateCartUI();
            openCartSidebar();
        }

        function updateCartUI() {
            const countElem = document.getElementById('cart-count');
            const itemsContainer = document.getElementById('sidebar-items');
            
            let totalCount = 0;
            let subtotal = 0;

            itemsContainer.innerHTML = '';

            if (cart.length === 0) {
                itemsContainer.innerHTML = '<p style="color: #b5b5c3; text-align: center; font-size: 14px;">Your cart is empty</p>';
                countElem.textContent = 0;
                calculateTotal();
                return;
            }

            cart.forEach(item => {
                totalCount += item.quantity;
                subtotal += item.price * item.quantity;

                itemsContainer.innerHTML += `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #ebedf2; padding-bottom: 8px; font-size: 13px;">
                        <div>
                            <strong>${item.name}</strong><br>
                            Rs. ${item.price} x ${item.quantity}
                        </div>
                        <button onclick="removeItem(${item.id})" style="background:none; border:none; color:red; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });

            countElem.textContent = totalCount;
            calculateTotal();
        }

        function removeItem(id) {
            cart = cart.filter(i => i.id !== id);
            updateCartUI();
        }

        // Calculate Totals with COD Charges Logic (Rs. 60)
        function calculateTotal() {
            let subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            let paymentMethod = document.getElementById('payment-method').value;
            
            // COD extra charges set to Rs. 60, Online set to Rs. 0
            let extraCharges = (paymentMethod === 'cod') ? 60 : 0;
            let grandTotal = subtotal + (subtotal > 0 ? extraCharges : 0);

            document.getElementById('summary-subtotal').textContent = `Rs. ${subtotal.toLocaleString()}`;
            document.getElementById('summary-charges').textContent = `Rs. ${extraCharges.toLocaleString()}`;
            document.getElementById('summary-total').textContent = `Rs. ${grandTotal.toLocaleString()}`;
        }

        function openCartSidebar() {
            if (cart.length === 0) {
                alert("Your cart is empty! Please select a product first.");
                return;
            }
            document.getElementById('modal-overlay').style.display = 'block';
            document.getElementById('cart-sidebar').classList.add('open');
            calculateTotal();
        }

        function closeCartSidebar() {
            document.getElementById('modal-overlay').style.display = 'none';
            document.getElementById('cart-sidebar').classList.remove('open');
        }

        // Place Order Function
        function placeOrder() {
            const name = document.getElementById('cust-name').value.trim();
            const address = document.getElementById('cust-address').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();

            if (!name || !address || !phone) {
                alert("Please fill in all your details (Name, Address, Phone)!");
                return;
            }

            alert("🎉 Congratulations! Your order has been placed successfully.");
            cart = [];
            updateCartUI();
            closeCartSidebar();

            function saveCustomerOrder(cartItems, customerDetails, totalAmount) {
    // Ek naya order object banana
    const newOrder = {
        id: "#" + Math.floor(1000 + Math.random() * 9000), // Random 4-digit Order ID jaise #1024
        customerName: customerDetails.name || "Customer",
        items: cartItems.map(item => item.name).join(', '), // Saare items ka naam
        total: totalAmount,
        status: "Pending" // Shuru mein status Pending hoga
    };

    // Pehle se mojood orders ko localStorage se nikalna
    let orders = JSON.parse(localStorage.getItem('estore_orders')) || [
        { id: "#1001", customerName: "Ali Khan", items: "Mechanical Keyboard", total: 6500, status: "Completed" }
    ];

    // Naya order list mein shamil karna
    orders.push(newOrder);

    // Wapis localStorage mein save karna
    localStorage.setItem('estore_orders', JSON.stringify(orders));
}
        }

        function handleLogout() {
            localStorage.removeItem('estore_user');
            window.location.href = 'login.html';
        }

        // Customer ke page par products load karne ke liye
function loadCustomerProducts() {
    const products = JSON.parse(localStorage.getItem('estore_products')) || [
        { id: 1, name: "Gaming Headset", price: 4500, stock: 8 },
        { id: 2, name: "Mechanical Keyboard", price: 6500, stock: 12 }
    ];

    const storeContainer = document.getElementById('store-products-container'); // Jahan products show hotay hain
    storeContainer.innerHTML = '';

    products.forEach(prod => {
        // Yahan aap apne product card ka HTML design render karein ge
        const productCard = `
            <div class="product-card">
                <h3>${prod.name}</h3>
                <p>Price: Rs. ${prod.price.toLocaleString()}</p>
                <p>Stock: ${prod.stock}</p>
                <button onclick="addToCart(${prod.id})">Add to Cart</button>
            </div>
        `;
        storeContainer.innerHTML += productCard;
    });
}

// Page load par call karein
window.addEventListener('DOMContentLoaded', () => {
    loadCustomerProducts();
});
    </script>
</body>
</html>
