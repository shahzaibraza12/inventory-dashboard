<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Store - Secure Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #1e1e2d; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .auth-container { background: #fff; padding: 40px; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0px 15px 35px rgba(0,0,0,0.3); }
        .auth-header { text-align: center; margin-bottom: 30px; }
        .auth-header h2 { font-size: 24px; color: #181c32; margin-top: 10px; }
        .auth-header p { font-size: 14px; color: #b5b5c3; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #3f4254; }
        .form-group input { width: 100%; padding: 12px 15px; border: 1px solid #ebedf2; border-radius: 8px; outline: none; font-size: 14px; transition: 0.3s; }
        .form-group input:focus { border-color: #3699ff; box-shadow: 0 0 0 3px rgba(54, 153, 255, 0.1); }
        .auth-btn { width: 100%; background: #3699ff; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s; font-size: 15px; }
        .auth-btn:hover { background: #187de4; }
        .auth-switch { text-align: center; margin-top: 20px; font-size: 14px; color: #b5b5c3; }
        .auth-switch span { color: #3699ff; cursor: pointer; font-weight: 600; }
        .auth-switch span:hover { text-decoration: underline; }
        .forgot-link { display: block; text-align: right; font-size: 13px; color: #3699ff; margin-top: -10px; margin-bottom: 20px; cursor: pointer; font-weight: 500; }
        .forgot-link:hover { text-decoration: underline; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Login Form -->
        <div id="login-section">
            <div class="auth-header">
                <i class="fa-solid fa-boxes-stacked" style="font-size: 36px; color: #3699ff;"></i>
                <h2>Welcome Back</h2>
                <p>Login to your E-Store account</p>
            </div>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password" required>
                </div>
                <span class="forgot-link" onclick="switchSection('forgot-section')">Forgot Password?</span>
                <button type="submit" class="auth-btn">Login</button>
            </form>
            <div class="auth-switch">
                Don't have an account? <span onclick="switchSection('signup-section')">Sign Up</span>
            </div>
        </div>

        <!-- Signup Form -->
        <div id="signup-section" class="hidden">
            <div class="auth-header">
                <i class="fa-solid fa-user-plus" style="font-size: 36px; color: #1bc5bd;"></i>
                <h2>Create Account</h2>
                <p>Register a new Customer profile</p>
            </div>
            <form onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="signup-name" placeholder="Ali" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="signup-email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signup-password" placeholder="Create a password" required>
                </div>
                <button type="submit" class="auth-btn" style="background: #1bc5bd;">Sign Up as Customer</button>
            </form>
            <div class="auth-switch">
                Already have an account? <span onclick="switchSection('login-section')">Login</span>
            </div>
        </div>

        <!-- Forgot Password Form -->
        <div id="forgot-section" class="hidden">
            <div class="auth-header">
                <i class="fa-solid fa-key" style="font-size: 36px; color: #ffa800;"></i>
                <h2>Reset Password</h2>
                <p>Enter your email to reset your password</p>
            </div>
            <form onsubmit="handleForgotPassword(event)">
                <div class="form-group">
                    <label>Registered Email Address</label>
                    <input type="email" id="forgot-email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="forgot-new-password" placeholder="Enter new password" required>
                </div>
                <button type="submit" class="auth-btn" style="background: #ffa800;">Reset Password</button>
            </form>
            <div class="auth-switch">
                Remember your password? <span onclick="switchSection('login-section')">Login</span>
            </div>
        </div>
    </div>

    <script>
        function switchSection(sectionId) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('signup-section').classList.add('hidden');
            document.getElementById('forgot-section').classList.add('hidden');
            document.getElementById(sectionId).classList.remove('hidden');
        }

        async function handleSignup(event) {
            event.preventDefault();
            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim().toLowerCase();
            const password = document.getElementById('signup-password').value;

            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const result = await response.json();
                alert(result.message);
                if (result.success) {
                    switchSection('login-section');
                }
            } catch (error) {
                alert("Server error during signup.");
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;

            // --- EMERGENCY ADMIN BYPASS ---
            if (email === "admin@estore.com" && password === "admin123") {
                const adminUser = {
                    name: "Store Admin",
                    email: "admin@estore.com",
                    role: "admin"
                };
                localStorage.setItem('estore_user', JSON.stringify(adminUser));
                window.location.href = 'admin.html';
                return;
            }
            // ------------------------------

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const result = await response.json();

                if (result.success) {
                    const user = result.user;
                    localStorage.setItem('estore_user', JSON.stringify(user));

                    if (user.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                } else {
                    alert(result.message);
                }
            } catch (error) {
                alert("Server error during login.");
            }
        }

        async function handleForgotPassword(event) {
            event.preventDefault();
            const email = document.getElementById('forgot-email').value.trim().toLowerCase();
            const newPassword = document.getElementById('forgot-new-password').value;

            try {
                const response = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, newPassword })
                });
                const result = await response.json();
                alert(result.message);
                if (result.success) {
                    switchSection('login-section');
                }
            } catch (error) {
                alert("Server error during password reset.");
            }
        }
    </script>
</body>
</html>
