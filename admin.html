<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Store - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #f3f6f9; color: #333; min-height: 100vh; padding: 25px; }
        .admin-container { max-width: 1200px; margin: 0 auto; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 25px; border-radius: 12px; box-shadow: 0px 4px 12px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .header-bar h2 { color: #181c32; font-size: 22px; }
        .logout-btn { background: #f64e60; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .logout-btn:hover { background: #d93848; }
        .grid-section { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 25px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0px 4px 12px rgba(0,0,0,0.05); }
        .card h3 { margin-bottom: 15px; color: #181c32; font-size: 18px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: #3f4254; }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ebedf2; border-radius: 6px; outline: none; font-size: 14px; }
        .form-group input:focus { border-color: #3699ff; }
        .submit-btn { background: #3699ff; color: white; border: none; padding: 10px; border-radius: 6px; width: 100%; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { background: #187de4; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { border-bottom: 2px solid #ebedf2; color: #b5b5c3; padding: 10px; }
        td { padding: 12px; border-bottom: 1px solid #ebedf2; }
        .delete-btn { background: #f64e60; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        @media (max-width: 768px) { .grid-section { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="admin-container">
        <!-- Top Bar -->
        <div class="header-bar">
            <h2>⚡ <span id="display-admin-name">Store Admin</span> Panel</h2>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>

        <!-- Grid: Add Product & Customer Orders -->
        <div class="grid-section">
            <!-- Add Product Form -->
            <div class="card">
                <h3><i class="fa-solid fa-plus-circle" style="color: #3699ff;"></i> Add New Product</h3>
                <form onsubmit="handleAddProduct(event)">
                    <div class="form-group">
                        <label>Product Name</label>
                        <input type="text" id="prod-name" placeholder="e.g. Wireless Mouse" required>
                    </div>
                    <div class="form-group">
                        <label>Price (PKR)</label>
                        <input type="number" id="prod-price" placeholder="e.g. 2500" required>
                    </div>
                    <div class="form-group">
                        <label>Stock Quantity</label>
                        <input type="number" id="prod-stock" placeholder="e.g. 15" required>
                    </div>
                    <button type="submit" class="submit-btn">Add Product</button>
                </form>
            </div>

            <!-- Customer Orders -->
            <div class="card">
                <h3><i class="fa-solid fa-shopping-cart" style="color: #1bc5bd;"></i> Customer Orders</h3>
                <div style="max-height: 250px; overflow-y: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Item</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table-body">
                            <tr>
                                <td>#1001</td>
                                <td>Ali Khan</td>
                                <td>Mechanical Keyboard</td>
                                <td><span style="background: rgba(27,197,189,0.1); color: #1bc5bd; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 600;">Completed</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Store Inventory Management -->
        <div class="card">
            <h3><i class="fa-solid fa-boxes-stacked" style="color: #ffa800;"></i> Store Inventory Management</h3>
            <table>
                <thead>
                    <tr>
                        <th>Product Name</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="inventory-table-body">
                    <tr>
                        <td>Gaming Headset</td>
                        <td>Rs. 4,500</td>
                        <td>8</td>
                        <td>
                            <button class="delete-btn" onclick="this.parentElement.parentElement.remove()">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Check Admin Authentication on Load
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('estore_user');
            if (!savedUser) {
                window.location.href = '../login.html';
                return;
            }

            const user = JSON.parse(savedUser);
            if (user.role !== 'admin') {
                alert("Access denied! Admins only.");
                window.location.href = '../index.html';
                return;
            }

            document.getElementById('display-admin-name').textContent = user.name;
        });

        // Handle Logout
        function handleLogout() {
            localStorage.removeItem('estore_user');
            window.location.href = '../login.html';
        }

        // Handle Add Product
        function handleAddProduct(event) {
            event.preventDefault();
            const name = document.getElementById('prod-name').value;
            const price = document.getElementById('prod-price').value;
            const stock = document.getElementById('prod-stock').value;

            const tableBody = document.getElementById('inventory-table-body');
            const newRow = document.createElement('tr');
            newRow.innerHTML = `
                <td>${name}</td>
                <td>Rs. ${Number(price).toLocaleString()}</td>
                <td>${stock}</td>
                <td>
                    <button class="delete-btn" onclick="this.parentElement.parentElement.remove()">Delete</button>
                </td>
            `;
            tableBody.appendChild(newRow);

            alert("Product added successfully!");
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('prod-stock').value = '';
        }
    </script>
</body>
</html>
